<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOW Time Clock</title>
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WOW Time Clock">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    background: #FAF9F5;
    color: #201F1D;
    text-align: center;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 1px 2px rgba(32,31,29,0.06), 0 10px 28px rgba(32,31,29,0.09);
  }
  img.logo { height: 54px; width: auto; margin-bottom: 16px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p.sub { font-size: 14px; color: #6E7072; margin: 0 0 22px; line-height: 1.5; }
  .btn-link {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 11px;
    color: #fff;
    background: #058244;
    box-shadow: 0 4px 0 #033f21;
    text-decoration: none;
    box-sizing: border-box;
  }
  p.hint {
    font-size: 12px;
    color: #9FA1A4;
    margin: 18px 0 0;
    line-height: 1.4;
  }
  #loading { display: none; font-size: 14px; color: #6E7072; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon-180.png" alt="WOW Windowboxes">
    <div id="content">
      <p id="loading">Opening WOW Time Clock&hellip;</p>
    </div>
  </div>

<script>
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbw8btSucorhtV8STuRMx0DtdPN_NjPtkJa3IglA_TmNc2EsWVWgjJ3TT0-JRdbsp0qS9A/exec';
  var TOKEN_KEY = 'wowPairedToken';
  var content = document.getElementById('content');

  var params = new URLSearchParams(window.location.search);
  var incomingToken = params.get('setToken');
  var shouldClear = params.get('clear');

  if (incomingToken) {
    try { localStorage.setItem(TOKEN_KEY, incomingToken); } catch (e) {}
  }
  if (shouldClear) {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }
  if (incomingToken || shouldClear) {
    // Keep the saved/bookmarked URL clean - the token lives in localStorage, not the URL.
    history.replaceState(null, '', window.location.pathname);
  }

  var pairedToken = null;
  try { pairedToken = localStorage.getItem(TOKEN_KEY); } catch (e) {}

  var isStandalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (isStandalone && pairedToken) {
    // Already installed and already paired - skip straight to the app, no tap needed.
    document.getElementById('loading').style.display = 'block';
    location.replace(EXEC_URL + '?t=' + encodeURIComponent(pairedToken));
  } else {
    render();
  }

  function render() {
    var openUrl = pairedToken ? (EXEC_URL + '?t=' + encodeURIComponent(pairedToken)) : EXEC_URL;
    var heading = pairedToken ? 'Welcome back!' : 'WOW Time Clock';
    var sub = pairedToken
      ? "Tap below to clock in or out."
      : "Tap below to get started. If this is a manager setting up a phone for the first time, you'll pick a name and enter the setup passcode on the next page.";
    var addedNote = isStandalone
      ? ''
      : '<p class="hint">Tip: after tapping below, use <strong>Share &rarr; Add to Home Screen</strong> so this page shows the WOW icon and opens instantly next time.</p>';

    content.innerHTML =
      '<h1>' + heading + '</h1>' +
      '<p class="sub">' + sub + '</p>' +
      '<a class="btn-link" href="' + openUrl + '">Open WOW Time Clock</a>' +
      addedNote;
  }
</script>
</body>
</html>
